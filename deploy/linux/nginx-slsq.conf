# Nginx site for SLSQ - installed by 04-deploy-app.sh
# 05-enable-ssl.sh (certbot) adds the HTTPS server blocks and http->https redirects.

# ---------- Website (React build) ----------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # IIS file from the shared build - not needed on Linux
    location = /web.config { deny all; }

    # Hashed static assets - cache for a year
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always fetch a fresh index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router SPA fallback (same as the Coolify nginx rule)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- API (reverse proxy to Node on localhost:5000) ----------
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # API allows 10 MB images and 20 MB PDFs
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
